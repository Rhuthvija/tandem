<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tandem</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root { --bg:#F5F3FA; --card:#fff; --ink:#1E1B2E; --muted:#5E5873; --line:#ECE8F5;
          --brand:#5443B8; --brand-soft:#EEEBF9; --warm:#E8833A; --warm-soft:#FDF0E6; --ok:#2F7A4F; --err:#B42318; }
  * { box-sizing: border-box; }
  body { margin:0; background:#E9E6F2; font-family:'Manrope',system-ui,sans-serif; color:var(--ink); }
  .app { max-width:430px; min-height:100vh; margin:0 auto; background:var(--bg); display:flex; flex-direction:column; }
  h1,h2 { font-family:'Bricolage Grotesque',sans-serif; margin:0; }
  header { padding:24px 22px 8px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .date { font-size:13px; font-weight:600; color:var(--muted); }
  h1 { font-size:26px; line-height:1.15; }
  .ring { position:relative; width:64px; height:64px; flex-shrink:0; }
  .ring svg { transform:rotate(-90deg); }
  .ring span { position:absolute; inset:0; display:grid; place-items:center; font-size:13px; font-weight:700; }
  .section-label { font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.06em; padding:14px 22px 8px; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:0 22px; scrollbar-width:none; }
  .chip { white-space:nowrap; padding:8px 12px; border-radius:12px; background:var(--card); border:1px solid #DCD6EC; font-size:13px; font-weight:600; }
  .chip.tbd { border-style:dashed; border-color:#E8B38A; background:var(--warm-soft); color:#7A3A0E; }
  .chip.exam { background:var(--warm-soft); border-color:#F3CFB3; color:#7A3A0E; }
  .next { margin:16px 22px 0; padding:16px; border-radius:20px; background:var(--brand); color:#fff; }
  .next small { font-size:12px; font-weight:700; letter-spacing:.06em; color:#E4DFF7; }
  .next h2 { font-size:21px; margin:6px 0 4px; }
  .next p { margin:0; font-size:14px; color:#F1EEFC; }
  .plan { flex:1; margin-top:18px; background:var(--card); border-radius:28px 28px 0 0; padding:20px 22px 120px; }
  .plan-head { display:flex; justify-content:space-between; align-items:baseline; }
  .plan-head h2 { font-size:20px; }
  .status { font-size:13px; font-weight:700; color:var(--ok); }
  .bar { height:8px; border-radius:4px; background:var(--line); margin:10px 0 8px; overflow:hidden; }
  .bar div { height:100%; background:var(--brand); transition:width .4s; }
  .item { display:flex; align-items:center; gap:12px; min-height:48px; border-bottom:1px solid var(--line); }
  .item .time { width:46px; font-size:12px; font-weight:600; color:var(--muted); }
  .item input { width:22px; height:22px; accent-color:var(--brand); margin:0; cursor:pointer; }
  .item .title { flex:1; font-size:15px; font-weight:500; }
  .item.done .title { color:var(--muted); text-decoration:line-through; }
  .tag { font-size:11px; font-weight:700; color:var(--brand); background:var(--brand-soft); padding:3px 8px; border-radius:8px; }
  .empty { color:var(--muted); font-size:14px; padding:12px 0; }
  .composer { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; padding:12px 16px 20px; background:linear-gradient(transparent, var(--card) 30%); }
  .reply { background:var(--brand-soft); padding:12px 14px; border-radius:16px; font-size:14px; margin-bottom:10px; display:none; }
  .reply.show { display:block; }
  .inputrow { display:flex; gap:8px; background:var(--card); border:1px solid #DCD6EC; border-radius:24px; padding:6px 6px 6px 16px; }
  .inputrow input { flex:1; border:none; outline:none; font:inherit; font-size:15px; background:transparent; }
  .send { width:44px; height:44px; border-radius:22px; border:none; background:var(--brand); color:#fff; font-size:18px; cursor:pointer; }
  .send:disabled { opacity:.5; }
  .toast { position:fixed; top:20px; left:50%; transform:translate(-50%,-90px); background:var(--ink); color:#fff; padding:12px 18px; border-radius:14px; font-weight:600; font-size:14px; transition:transform .3s; z-index:30; }
  .toast.show { transform:translate(-50%,0); }

  /* onboarding */
  .onboard { position:fixed; inset:0; background:var(--bg); z-index:20; display:flex; justify-content:center; overflow-y:auto; }
  .onboard[hidden] { display:none; }
  .ob { width:100%; max-width:430px; padding:48px 26px 32px; display:flex; flex-direction:column; gap:18px; }
  .dots { display:flex; gap:6px; }
  .dots span { width:28px; height:6px; border-radius:3px; background:#DCD6EC; }
  .dots span.on { background:var(--brand); }
  .ob h1 { font-size:30px; }
  .ob p { margin:0; color:var(--muted); font-size:15px; line-height:1.5; }
  .ob label.field { font-size:14px; font-weight:700; display:flex; flex-direction:column; gap:8px; }
  .ob input[type=text], .ob textarea { font:inherit; font-size:16px; padding:14px; border-radius:14px; border:1px solid #DCD6EC; background:var(--card); outline-color:var(--brand); }
  .ob textarea { min-height:110px; resize:vertical; }
  .consent { display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--muted); line-height:1.45; }
  .consent input { width:20px; height:20px; accent-color:var(--brand); margin:2px 0 0; flex-shrink:0; }
  .options { display:flex; flex-direction:column; gap:10px; }
  .opt { text-align:left; font:inherit; font-size:16px; font-weight:600; padding:16px; border-radius:16px; border:1.5px solid #DCD6EC; background:var(--card); cursor:pointer; color:var(--ink); }
  .opt small { display:block; font-weight:500; font-size:13px; color:var(--muted); margin-top:2px; }
  .opt:hover { border-color:var(--brand); }
  .opt.picked { border-color:var(--brand); background:var(--brand-soft); }
  .primary { font:inherit; font-size:16px; font-weight:700; padding:16px; border-radius:16px; border:none; background:var(--brand); color:#fff; cursor:pointer; margin-top:6px; }
  .error { color:var(--err); font-size:13px; min-height:18px; }
  .back { align-self:flex-start; background:none; border:none; font:inherit; color:var(--muted); font-weight:600; cursor:pointer; padding:8px 0; }
  .next-row { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
  .done-btn { font:inherit; font-weight:700; font-size:14px; padding:10px 16px; border-radius:12px; border:none; background:#fff; color:var(--brand); cursor:pointer; white-space:nowrap; }
  .modal { position:fixed; inset:0; background:rgba(30,27,46,.45); display:flex; align-items:center; justify-content:center; z-index:25; padding:20px; }
  .modal[hidden] { display:none; }
  .cc { background:var(--card); border-radius:24px; padding:26px 22px; max-width:360px; width:100%; text-align:center; display:flex; flex-direction:column; gap:12px; }
  .cc .big { font-size:44px; }
  .cc h2 { font-size:22px; }
  .cc p { margin:0; color:var(--muted); font-size:14px; }
  .took { display:flex; gap:8px; }
  .took button { flex:1; font:inherit; font-size:13px; font-weight:600; padding:12px 6px; border-radius:12px; border:1.5px solid #DCD6EC; background:#fff; cursor:pointer; color:var(--ink); }
  .took button:hover { border-color:var(--brand); }
  .skip { background:none; border:none; font:inherit; color:var(--muted); cursor:pointer; padding:6px; }
  .mic { width:44px; height:44px; border-radius:22px; border:none; background:var(--brand-soft); font-size:18px; cursor:pointer; flex-shrink:0; }
  .mic.rec { background:#E5484D; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.1); } }
  .heard { font-size:12px; color:var(--muted); margin-bottom:6px; font-style:italic; }
  .wrap { width:100%; margin-top:18px; font:inherit; font-size:15px; font-weight:700; padding:14px; border-radius:16px; border:1.5px dashed #C9C0EA; background:var(--brand-soft); color:var(--brand); cursor:pointer; }
  .sheet { background:var(--card); border-radius:24px; padding:24px 20px; max-width:400px; width:100%; display:flex; flex-direction:column; gap:12px; max-height:90vh; overflow-y:auto; }
  .sheet h2 { font-size:22px; }
  .sheet label { font-size:14px; font-weight:700; display:flex; flex-direction:column; gap:6px; }
  .sheet textarea { font:inherit; font-size:15px; padding:12px; border-radius:12px; border:1px solid #DCD6EC; min-height:70px; resize:vertical; }
  .moods { display:flex; gap:8px; flex-wrap:wrap; }
  .moods button { font:inherit; font-size:14px; font-weight:600; padding:10px 12px; border-radius:12px; border:1.5px solid #DCD6EC; background:#fff; cursor:pointer; color:var(--ink); }
  .moods button.picked { border-color:var(--brand); background:var(--brand-soft); }
  .daycard { background:var(--card); border-radius:24px; overflow:hidden; max-width:380px; width:100%; max-height:92vh; overflow-y:auto; }
  .daycard img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:var(--brand-soft); }
  .daycard .body { padding:18px 20px 20px; display:flex; flex-direction:column; gap:8px; }
  .daycard .meta { font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.04em; }
  .daycard h2 { font-size:24px; }
  .daycard .lesson { background:var(--warm-soft); color:#7A3A0E; padding:10px 12px; border-radius:12px; font-size:14px; }
  .daycard .note { font-size:14px; color:var(--muted); margin:0; }
  .daycard .streak { font-weight:700; font-size:14px; }
  .leftover { background:var(--warm-soft); color:#7A3A0E; padding:12px; border-radius:12px; font-size:14px; display:flex; flex-direction:column; gap:8px; }
  .leftover label { display:flex; gap:8px; align-items:center; font-weight:600; font-size:14px; cursor:pointer; }
  .leftover input { width:18px; height:18px; accent-color:var(--warm); margin:0; }
  .daycard .week { font-weight:700; font-size:14px; color:var(--brand); }
</style>
</head>
<body>

<!-- ONBOARDING -->
<div class="onboard" id="onboard" hidden>
  <div class="ob" id="ob"></div>
</div>

<!-- TODAY -->
<div class="app">
  <header>
    <div>
      <div class="date" id="date"></div>
      <h1 id="greeting">Hello!</h1>
    </div>
    <div class="ring" title="Today's card colour">
      <svg width="64" height="64"><circle cx="32" cy="32" r="26" fill="none" stroke="#E4DFF7" stroke-width="7"/>
        <circle id="ringFill" cx="32" cy="32" r="26" fill="none" stroke="#5443B8" stroke-width="7" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="163.4" style="transition:stroke-dashoffset .5s"/></svg>
      <span id="ringText">0%</span>
    </div>
  </header>

  <div class="section-label">COMING UP</div>
  <div class="chips" id="chips"></div>

  <div class="next" id="next" style="display:none">
    <small id="nextTime">NEXT UP</small>
    <div class="next-row">
      <div><h2 id="nextTitle"></h2><p id="nextFor"></p></div>
      <button class="done-btn" id="nextDone">Done ✓</button>
    </div>
  </div>

  <section class="plan">
    <div class="plan-head"><h2>Today's plan</h2><span class="status" id="status"></span></div>
    <div class="bar"><div id="bar" style="width:0%"></div></div>
    <div id="list"></div>
    <button class="wrap" id="wrapBtn">🌙 Wrap up my day</button>
  </section>
</div>

<div class="composer">
  <div class="reply" id="reply"></div>
  <form class="inputrow" id="form">
    <label for="msg" style="position:absolute;left:-9999px">Message Tandem</label>
    <input id="msg" placeholder="Tell Tandem anything…" autocomplete="off">
    
    <button type="button" class="mic" id="mic" aria-label="Talk to Tandem">🎤</button>
    <button class="send" id="send" aria-label="Send">➤</button>
  </form>
</div>
<div class="modal" id="cc" hidden>
  <div class="cc" role="dialog" aria-labelledby="ccTitle">
    <div class="big">🎉</div>
    <h2 id="ccTitle"></h2>
    <p id="ccSub"></p>
    <div id="ccAsk">
      <p style="margin-bottom:8px">How long did it take?</p>
      <div class="took">
        <button data-took="quicker">⚡ Quicker</button>
        <button data-took="as_planned">👌 As planned</button>
        <button data-took="longer">🐢 Longer</button>
      </div>
    </div>
    <button class="skip" id="ccSkip">Skip</button>
  </div>
</div>
<div class="modal" id="reflectModal" hidden>
  <div class="sheet" role="dialog" aria-labelledby="rTitle">
    <h2 id="rTitle">How did today go? 🌙</h2>
    <p id="rSummary" style="margin:0;color:var(--muted);font-size:14px"></p>
    <div style="font-size:14px;font-weight:700">What went well? <span style="font-weight:500;color:var(--muted)">tap any</span></div>
    <div class="moods" id="rWins"></div>
    <div class="leftover" id="rLeft"></div>
    <div style="font-size:14px;font-weight:700">How are you feeling?</div>
    <div class="moods">
      <button type="button" data-mood="proud">🔥 Proud</button>
      <button type="button" data-mood="calm">😌 Calm</button>
      <button type="button" data-mood="okay">🙂 Okay</button>
      <button type="button" data-mood="drained">😮‍💨 Drained</button>
    </div>
    <div class="error" id="rErr"></div>
    <button class="primary" id="rSave">Make my day card</button>
    <button class="skip" id="rCancel">Not now</button>
  </div>
</div>

<div class="modal" id="cardModal" hidden>
  <div class="daycard" role="dialog" aria-labelledby="dcTitle">
    <img id="dcImg" alt="Illustration of your day">
    <div class="body">
      <div class="meta" id="dcMeta"></div>
      <h2 id="dcTitle"></h2>
      <div class="lesson" id="dcLesson"></div>
      <p class="note" id="dcNote"></p>
      <div class="week" id="dcWeek"></div>
      <div class="streak" id="dcStreak"></div>
      <button class="primary" id="dcClose">Good night 🌙</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const fmtDate = d => new Date(d + "T00:00").toLocaleDateString("en-IN", { weekday:"short", day:"numeric", month:"short" });
const cheers = ["Nice one! 🎉", "Done and dusted ✨", "Look at you go 🚀", "One more colour on today's card 🎨", "That's progress 💪"];
let profile = null, lastItems = [], reflectedToday = false, bedtimeShown = "";

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function toast(text) { $("toast").textContent = text; $("toast").classList.add("show"); setTimeout(() => $("toast").classList.remove("show"), 2400); }

/* ---------------- ONBOARDING ---------------- */
const answers = { name:"", routine:"", wake:"", sleep:"", energy:"", per_day:3 };
let step = 0;

function dots(n) { const d = el("div","dots"); for (let i=0;i<6;i++){ const s=el("span"); if(i<=n) s.className="on"; d.append(s);} return d; }
function backBtn() { const b = el("button","back","← Back"); b.type="button"; b.onclick = () => { step--; renderStep(); }; return b; }

function choice(title, sub, value, key) {
  const b = el("button", "opt" + (answers[key] === value ? " picked" : "")); b.type = "button";
  b.append(document.createTextNode(title)); if (sub) b.append(el("small", null, sub));
  b.onclick = () => { answers[key] = value; step++; renderStep(); };
  return b;
}

function renderStep() {
  const ob = $("ob"); ob.innerHTML = "";
  if (step === 0) {
    ob.append(dots(0), el("h1", null, "Hey, I'm Tandem 👋"),
      el("p", null, "We plan your day together, so you can sleep peacefully knowing what you got done. Takes a minute to set up."));
    const lab = el("label","field","What should I call you?");
    const name = el("input"); name.type="text"; name.value = answers.name; name.placeholder = "Your name"; lab.append(name);
    const consent = el("label","consent"); const cb = el("input"); cb.type="checkbox";
    consent.append(cb, el("span", null, "I'm okay with Tandem saving my plans so it can remember them, and using Meta's AI models to plan with me."));
    const err = el("div","error");
    const go = el("button","primary","Let's go"); go.type="button";
    const clear = () => err.textContent = "";
    name.oninput = clear; cb.onchange = clear;
    go.onclick = () => {
      if (!name.value.trim()) { err.textContent = "Tell me your name first 🙂"; return; }
      if (!cb.checked) { err.textContent = "Please tick the box to continue"; return; }
      answers.name = name.value.trim(); step = 1; renderStep();
    };
    ob.append(lab, consent, err, go);
    name.focus();
  }
  else if (step === 1) {
    ob.append(backBtn(), dots(1), el("h1", null, `What's fixed in your week, ${answers.name}?`),
      el("p", null, "Classes, work, gym, anything that doesn't move. Type it like you'd text a friend."));
    const ta = el("textarea"); ta.value = answers.routine;
    ta.placeholder = "college 8:30–4 on weekdays, japanese 5:20–8:30 pm, internship 9–12 at night…";
    ta.setAttribute("aria-label","Your fixed weekly routine");
    const err = el("div","error"); ta.oninput = () => err.textContent = "";
    const next = el("button","primary","Next"); next.type="button";
    next.onclick = () => {
      if (ta.value.trim().length < 5) { err.textContent = "Add at least one thing, even just your work or class hours"; return; }
      answers.routine = ta.value.trim(); step = 2; renderStep();
    };
    ob.append(ta, err, next); ta.focus();
  }
  else if (step === 2) {
    const opts = el("div","options");
    opts.append(choice("🌅 Up before the sun", "the early bird", "06:00", "wake"),
                choice("☕ Up around 7", "coffee, then the world", "07:00", "wake"),
                choice("😴 Snooze-button champion", "8 or later, no shame", "08:30", "wake"));
    ob.append(backBtn(), dots(2), el("h1", null, "Which one sounds like you?"),
      el("p", null, "So I never plan things while you're still in bed."), opts);
  }
  else if (step === 3) {
    const opts = el("div","options");
    opts.append(choice("🌙 Before 10", "early to bed", "22:00", "sleep"),
                choice("📺 Around 11", "one more episode", "23:00", "sleep"),
                choice("🕛 Midnight-ish", "the classic", "00:00", "sleep"),
                choice("🦉 Way past midnight", "night owl life", "01:30", "sleep"));
    ob.append(backBtn(), dots(3), el("h1", null, "When does your day usually end?"),
      el("p", null, "I'll check in to wrap up the day just before."), opts);
  }
  else if (step === 4) {
    const opts = el("div","options");
    opts.append(choice("🌅 Morning", "fresh brain, early start", "morning", "energy"),
                choice("☀️ Afternoon", "warmed up by lunch", "afternoon", "energy"),
                choice("🌆 Evening", "come alive after work", "evening", "energy"),
                choice("🌙 Night", "the late-night grinder", "night", "energy"));
    ob.append(backBtn(), dots(4), el("h1", null, "When do you get the most done?"),
      el("p", null, "I'll put your hardest stuff here."), opts);
  }
  else if (step === 5) {
    const opts = el("div","options");
    const pick = (title, sub, n) => {
      const b = el("button","opt" + (answers.per_day === n ? " picked":"")); b.type="button";
      b.append(document.createTextNode(title), el("small", null, sub));
      b.onclick = () => { answers.per_day = n; finish(); };
      return b;
    };
    opts.append(pick("1 big thing", "keep it light", 1), pick("3 big things", "balanced", 3), pick("5 big things", "beast mode", 5));
    ob.append(backBtn(), dots(5), el("h1", null, "How much can you take on in a day?"),
      el("p", null, "Be honest. I'd rather you finish 3 than feel bad about 9."),
      el("p", null, "Big things = focus work. Quick to-dos like \"buy milk\" don't count, add as many as you want."), opts);
  }
}

async function finish() {
  $("ob").innerHTML = ""; $("ob").append(el("h1", null, "Setting things up… ✨"));
  await fetch("/onboarding", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(answers) });
  profile = { name: answers.name, wake: answers.wake, sleep: answers.sleep };
  $("onboard").hidden = true;
  await load();
  $("reply").textContent = `🤝 All set, ${answers.name}! What's coming up this week? Exams, deadlines, plans, anything.`;
  $("reply").classList.add("show");
  $("msg").focus();
}

/* ---------------- TODAY ---------------- */
async function load() {
  const data = await (await fetch("/today")).json();
  const now = new Date(), h = now.getHours();
  const name = profile?.name ? `, ${profile.name}` : "";
  $("greeting").textContent = (h < 5 ? "Still up" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening") + name;
  $("date").textContent = now.toLocaleDateString("en-IN", { weekday:"long", day:"numeric", month:"long" });

  const chips = $("chips"); chips.innerHTML = "";
  if (!data.upcoming.length) chips.append(el("span","chip","Nothing yet. Tell Tandem what's coming up!"));
  data.upcoming.forEach(e => {
    if (e.date === "unknown") chips.append(el("span", "chip tbd", `📅 date? · ${e.title}`));
    else chips.append(el("span", "chip" + (e.kind === "exam" ? " exam" : ""), `${fmtDate(e.date)} · ${e.title}`));
  });

  const pct = data.total ? Math.round(100 * data.done / data.total) : 0;
  $("bar").style.width = pct + "%";
  $("ringFill").style.strokeDashoffset = 163.4 * (1 - pct / 100);
  $("ringText").textContent = pct + "%";
  $("status").textContent = data.total ? `${data.done} of ${data.total} done` : "";

  const items = [
    ...data.tasks.map(t => ({ ...t, kind:"task" })),
    ...data.habits.map(hb => ({ id:hb.id, done:hb.done, time:hb.time, kind:"habit",
                                title:`${hb.title} (${hb.minutes} min)`, for_event:"Daily habit" })),
  ].sort((a,b) => (a.time||"").localeCompare(b.time||""));

  lastItems = items; reflectedToday = data.reflected;
  const hhmm = now.toTimeString().slice(0,5);
  const pending = items.filter(i => !i.done);
  const next = pending.find(i => (i.time||"") >= hhmm) || pending[0];
  $("next").style.display = next ? "block" : "none";
  if (next) {
    $("nextTime").textContent = `NEXT UP · ${next.time || "anytime"}`;
    $("nextTitle").textContent = next.title;
    $("nextFor").textContent = `For: ${next.for_event}`;
    $("nextDone").onclick = () => complete(next);
  }

  const list = $("list"); list.innerHTML = "";
  if (!items.length) list.append(el("div","empty","No plan yet. Tell Tandem about your day below 👇"));
  items.forEach(it => {
    const row = el("label", "item" + (it.done ? " done" : ""));
    row.append(el("span","time", it.time || "--:--"));
    const box = el("input"); box.type = "checkbox"; box.checked = it.done;
    box.onchange = () => complete(it);
    row.append(box, el("span","title", it.title));
    if (it.kind === "habit") row.append(el("span","tag","daily"));
    list.append(row);
  });
}

let ccItem = null;
function celebrate(item) {
  ccItem = item;
  $("ccTitle").textContent = cheers[Math.floor(Math.random() * cheers.length)];
  $("ccSub").textContent = `"${item.title}" is done. +1 colour on today's card 🎨`;
  $("ccAsk").style.display = item.kind === "task" ? "block" : "none";
  $("cc").hidden = false;
}
document.querySelectorAll("[data-took]").forEach(b => b.onclick = async () => {
  if (ccItem?.kind === "task") {
    await fetch(`/tasks/${ccItem.id}/feedback`, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ took: b.dataset.took }) });
  }
  $("cc").hidden = true;
});
$("ccSkip").onclick = () => $("cc").hidden = true;

async function complete(item) {
  const url = item.kind === "task" ? `/tasks/${item.id}/done` : `/habits/${item.id}/done`;
  await fetch(url, { method:"POST" });
  if (!item.done) celebrate(item);
  load();
}

$("form").onsubmit = async e => {
  e.preventDefault();
  const text = $("msg").value.trim(); if (!text) return;
  $("msg").value = ""; $("send").disabled = true;
  $("reply").textContent = "Tandem is thinking…"; $("reply").classList.add("show");
  try {
    const res = await fetch("/chat", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ message:text }) });
    $("reply").textContent = "🤝 " + (await res.json()).reply;
    load();
  } catch { $("reply").textContent = "Couldn't reach Tandem. Is the server running?"; }
  $("send").disabled = false;
};
/* ---------------- VOICE ---------------- */
let audioCtx, source, processor, stream, chunks = [], recording = false;

async function startRec() {
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioCtx = new AudioContext({ sampleRate: 16000 });
  source = audioCtx.createMediaStreamSource(stream);
  processor = audioCtx.createScriptProcessor(4096, 1, 1);
  chunks = [];
  processor.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  source.connect(processor); processor.connect(audioCtx.destination);
}

function stopRec() {
  processor.disconnect(); source.disconnect(); stream.getTracks().forEach(t => t.stop());
  const rate = audioCtx.sampleRate; audioCtx.close();
  return encodeWav(chunks, rate);
}

function encodeWav(parts, rate) {
  const len = parts.reduce((n, c) => n + c.length, 0);
  const buf = new ArrayBuffer(44 + len * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + len * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, len * 2, true);
  let o = 44;
  for (const c of parts) for (let i = 0; i < c.length; i++, o += 2) {
    const s = Math.max(-1, Math.min(1, c[i])); v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([buf], { type: "audio/wav" });
}

function showReply(t) { $("reply").textContent = t; $("reply").classList.add("show"); }

$("mic").onclick = async () => {
  if (!recording) {
    try { await startRec(); } catch { showReply("I need microphone access to hear you 🎙️"); return; }
    recording = true; $("mic").classList.add("rec");
    showReply("Listening… tap the mic again when you're done");
  } else {
    recording = false; $("mic").classList.remove("rec");
    const wav = stopRec();
    showReply("Got it, thinking…");
    const fd = new FormData(); fd.append("audio", wav, "speech.wav");
    try {
      const res = await fetch("/voice", { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "error");
      $("reply").innerHTML = "";
      if (data.heard) $("reply").append(el("div", "heard", `You said: "${data.heard}"`));
      $("reply").append(el("div", null, "🤝 " + data.reply));
      load();
    } catch (err) { showReply("Voice didn't go through: " + err.message); }
  }
};
/* ---------------- EVENING REFLECTION ---------------- */
let mood = "", wins = new Set();
document.querySelectorAll("[data-mood]").forEach(b => b.onclick = () => {
  mood = b.dataset.mood;
  document.querySelectorAll("[data-mood]").forEach(x => x.classList.toggle("picked", x === b));
  $("rErr").textContent = "";
});

function openReflect() {
  const done = lastItems.filter(i => i.done), left = lastItems.filter(i => !i.done);
  $("rSummary").textContent = lastItems.length ? `You got ${done.length} of ${lastItems.length} done today.` : "Quiet day? Let's still close it out.";

  const w = $("rWins"); w.innerHTML = ""; wins = new Set();
  if (!done.length) w.append(el("span", null, "Nothing ticked today, and that's okay. Tomorrow's a fresh page 🌱"));
  done.forEach(i => {
    const b = el("button", null, "✓ " + i.title); b.type = "button";
    b.onclick = () => { b.classList.toggle("picked"); wins.has(i.title) ? wins.delete(i.title) : wins.add(i.title); };
    w.append(b);
  });

  const l = $("rLeft"); l.innerHTML = "";
  const leftTasks = left.filter(i => i.kind === "task");
  l.style.display = left.length ? "flex" : "none";
  if (left.length) {
    l.append(el("div", null, `${left.length} thing${left.length > 1 ? "s" : ""} left today. No stress, it happens 💜`));
    if (leftTasks.length) {
      const lab = el("label"); const cb = el("input"); cb.type = "checkbox"; cb.id = "rCarry"; cb.checked = true;
      lab.append(cb, el("span", null, `Move ${leftTasks.length > 1 ? "them" : "it"} to tomorrow`));
      l.append(lab);
    }
  }
  mood = ""; document.querySelectorAll("[data-mood]").forEach(x => x.classList.remove("picked"));
  $("rErr").textContent = ""; $("reflectModal").hidden = false;
}
$("wrapBtn").onclick = openReflect;
$("rCancel").onclick = () => $("reflectModal").hidden = true;

$("rSave").onclick = async () => {
  if (!mood) { $("rErr").textContent = "Pick how you're feeling first"; return; }
  $("rSave").disabled = true; $("rSave").textContent = "Painting your day card… 🎨";
  try {
    const res = await fetch("/reflect", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ went_well: [...wins], mood, carry_over: $("rCarry")?.checked ?? false }) });
    const card = await res.json();
    if (!res.ok) throw new Error(card.detail || "error");
    $("reflectModal").hidden = true;
    showCard(card);
    load();
  } catch (err) { $("rErr").textContent = "Couldn't make the card: " + err.message; }
  $("rSave").disabled = false; $("rSave").textContent = "Make my day card";
};

/* pop the wrap-up open ~5 minutes before bedtime */
function checkBedtime() {
  if (!profile?.sleep || reflectedToday || !$("reflectModal").hidden) return;
  const now = new Date();
  const [h, m] = profile.sleep.split(":").map(Number);
  const bed = new Date(now); bed.setHours(h, m, 0, 0);
  if (h < 5 && now.getHours() >= 12) bed.setDate(bed.getDate() + 1);  // after-midnight bedtimes
  const mins = (bed - now) / 60000;
  const key = now.toDateString();
  if (mins <= 5 && mins > -90 && bedtimeShown !== key) { bedtimeShown = key; openReflect(); }
}
setInterval(checkBedtime, 60000);

function showCard(c) {
  $("dcImg").style.display = c.image ? "block" : "none";
  if (c.image) $("dcImg").src = c.image + "?v=" + Date.now();
  $("dcMeta").textContent = `${fmtDate(c.date).toUpperCase()} · ${c.done} OF ${c.total} DONE`;
  $("dcTitle").textContent = c.title;
  $("dcLesson").textContent = "💡 " + c.lesson;
  $("dcNote").textContent = c.note;
  $("dcWeek").textContent = c.week?.total ? `📊 This week: ${c.week.done} of ${c.week.total} done (${Math.round(100 * c.week.done / c.week.total)}%)` : "";
  $("dcStreak").textContent = c.streak > 1 ? `🔥 ${c.streak}-day reflection streak` : "🌱 Day 1 of your reflection streak";
  $("cardModal").hidden = false;
}
$("dcClose").onclick = () => $("cardModal").hidden = true;
/* ---------------- START ---------------- */
(async () => {
  profile = (await (await fetch("/profile")).json()).profile;
  if (!profile) { $("onboard").hidden = false; renderStep(); }
  else { await load(); checkBedtime(); }
})();
